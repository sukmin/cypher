<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Cypher</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="items.css">
  <link rel="stylesheet" href="theme.css">
  <script src="look-early.js"></script>
</head>
<body>
  <aside id="sidebar">
    <div id="new-buttons"></div>
    <div id="folder-row">
      <span id="folder"></span>
      <button id="recent" title="최근 폴더에서 고르기">▾</button>
      <button id="pick" title="새 세션 폴더 바꾸기">폴더…</button>
    </div>
    <ul id="sessions" tabindex="-1"></ul>
    <div id="tools">
      <button id="waiting" title="대기 중인 세션만 보기 · 다음 대기 세션 (Ctrl+Shift+N)">대기 0</button>
      <button id="notices" title="알림 기록 (Ctrl+Shift+A) · 숫자: 안 본 알림">알림 0</button>
      <button id="changes" title="바뀐 파일과 차이 보기 (Ctrl+Shift+G)">변경 내용</button>
    </div>
  </aside>
  <div id="sidebar-grip" title="끌기: 너비 조절 · 두 번 누르기: 기본 너비"></div>
  <main>
    <div id="where" hidden></div>
    <div id="terms"><div id="empty">왼쪽에서 세션을 시작하세요.</div></div>
    <div id="composer" hidden>
      <div id="composer-grip" title="끌기: 높이 조절 · 두 번 누르기: 기본 높이"></div>
      <div id="composer-body">
        <textarea id="composer-text" spellcheck="false" autocomplete="off"></textarea>
        <div id="composer-side">
          <button id="composer-send" title="세션 입력창에 넣기 (Ctrl+Enter)">프롬프트</button>
          <label id="composer-enter-label" title="넣은 뒤 바로 보내기 (끄면 입력창에 넣기만)"><input type="checkbox" id="composer-enter" checked> 바로 전송</label>
        </div>
      </div>
      <div id="composer-tabs">
        <button id="composer-history" title="보낸 프롬프트 다시 쓰기 (Alt+↑/↓)">기록</button>
        <button id="composer-fold" title="프롬프트 편집기 접기/펼치기">프롬프트 편집기 ▾</button>
      </div>
    </div>
    <div id="search" hidden>
      <input id="search-input" placeholder="찾기" spellcheck="false">
      <span id="search-count"></span>
      <button id="search-case" title="대/소문자 구분 (Alt+C)">Aa</button>
      <button id="search-regex" title="정규식 (Alt+X)">.*</button>
      <button id="search-prev" title="이전 (Shift+Enter)">↑</button>
      <button id="search-next" title="다음 (Enter)">↓</button>
      <button id="search-close" title="닫기 (Esc)">×</button>
    </div>
    <div id="shots" hidden></div>
    <footer id="status">
      <span id="status-text"></span><span id="status-model" title="모델 · effort · 컨텍스트 사용률"></span><span id="status-mode"></span><span id="status-limits"></span>
    </footer>
  </main>
  <aside id="diff" class="side" hidden>
    <div class="side-head">
      <span id="diff-title" class="side-title">변경 내용</span>
      <button id="diff-refresh" title="다시 읽기">새로 고침</button>
      <button id="diff-close" class="close" title="닫기">×</button>
    </div>
    <ul id="diff-files" class="side-list"></ul>
    <div id="diff-view" class="side-view"></div>
  </aside>
  <div id="parked" hidden></div>
  <div id="print"></div>
  <div id="drop-hint" hidden></div>
  <div id="toasts"></div>
  <div id="menu" hidden></div>
  <dialog id="popup">
    <div id="popup-head"><b id="popup-title"></b><button id="popup-close" class="close" title="닫기">×</button></div>
    <div id="popup-body"></div>
  </dialog>
  <dialog id="ask">
    <form method="dialog">
      <label id="ask-title" for="ask-input"></label>
      <input id="ask-input" spellcheck="false" autocomplete="off">
      <div class="ask-buttons">
        <button value="ok">확인</button>
        <button value="cancel">취소</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="vendor/xterm/addon-webgl.js"></script>
  <script src="vendor/xterm/addon-unicode11.js"></script>
  <script src="vendor/xterm/addon-search.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
