<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Cypher</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <div id="new-buttons"></div>
    <div id="folder-row">
      <span id="folder"></span>
      <button id="pick" title="새 세션이 시작될 폴더 바꾸기">폴더…</button>
    </div>
    <ul id="sessions"></ul>
    <div id="tools">
      <button id="waiting" title="대기 중인 세션만 보기 · Ctrl+Shift+N: 다음 대기 세션으로">대기 0</button>
      <button id="changes" title="세션이 고친 파일과 차이 보기 (Ctrl+Shift+G)">변경 내용</button>
      <button id="browser" title="내장 브라우저 열기. 여기서 로그인하고 작업하던 것을 Claude 세션이 이어서 조작할 수 있습니다 (Ctrl+Shift+O)">브라우저</button>
      <button id="http-button" title="저장해 둔 HTTP 요청(.http 파일)을 실행하고 응답 보기 (Ctrl+Shift+H)">HTTP</button>
    </div>
  </aside>
  <main>
    <div id="terms"><div id="empty">왼쪽에서 세션을 시작하세요.</div></div>
    <div id="search" hidden>
      <input id="search-input" placeholder="찾기" spellcheck="false">
      <button id="search-prev" title="이전 (Shift+Enter)">↑</button>
      <button id="search-next" title="다음 (Enter)">↓</button>
      <button id="search-close" title="닫기 (Esc)">×</button>
    </div>
    <div id="shots" hidden></div>
    <footer id="status">
      <span id="status-text"></span><span id="status-model" title="지금 세션의 모델 · effort · 컨텍스트 사용률"></span><span id="status-mode"></span><span id="status-limits"></span><span id="status-usage"></span>
    </footer>
  </main>
  <aside id="diff" class="side" hidden>
    <div class="side-head">
      <span id="diff-title" class="side-title">변경 내용</span>
      <button id="diff-refresh" title="다시 읽기">새로 고침</button>
      <button id="diff-close" class="close" title="닫기">×</button>
    </div>
    <ul id="diff-files" class="side-list"></ul>
    <div id="diff-view" class="side-view"></div>
  </aside>
  <aside id="http" class="side" hidden>
    <div class="side-head">
      <span id="http-title" class="side-title">HTTP 요청</span>
      <select id="http-file" title="요청 파일 고르기 / 새 파일 만들기"></select>
      <button id="http-save" title="저장 (Ctrl+S)">저장</button>
      <button id="http-history" title="지난 실행의 요청·응답 기록 보기">기록</button>
      <button id="http-close" class="close" title="닫기">×</button>
    </div>
    <ul id="http-list" class="side-list"></ul>
    <div id="http-edit">
      <div id="http-gutter"></div>
      <textarea id="http-editor" spellcheck="false" autocomplete="off" wrap="off"></textarea>
    </div>
    <div id="http-view" class="side-view"></div>
  </aside>
  <div id="parked" hidden></div>
  <div id="drop-hint" hidden></div>
  <div id="toasts"></div>
  <div id="menu" hidden></div>
  <dialog id="popup">
    <div id="popup-head"><b id="popup-title"></b><button id="popup-close" class="close" title="닫기">×</button></div>
    <div id="popup-body"></div>
  </dialog>
  <dialog id="ask">
    <form method="dialog">
      <label id="ask-title" for="ask-input"></label>
      <input id="ask-input" spellcheck="false" autocomplete="off">
      <div class="ask-buttons">
        <button value="ok">확인</button>
        <button value="cancel">취소</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="vendor/xterm/addon-webgl.js"></script>
  <script src="vendor/xterm/addon-unicode11.js"></script>
  <script src="vendor/xterm/addon-search.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
