[package]
name = "cypher"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: Tauri CLI 없이 `cargo build`만으로 ui/ 폴더를 실행 파일에 넣는다.
# unstable: 창 하나에 웹뷰 여러 개(브라우저 창의 주소 줄 + 페이지)를 넣는 데 필요하다.
tauri = { version = "2", features = ["custom-protocol", "unstable"] }
webview2-com = "0.39"
windows-core = "0.62"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
png = "0.17"
base64 = "0.22"
open = "5"
rfd = "0.15"
# gzip 기능은 끈다: 켜 두면 `Content-Encoding: gzip`으로 저장된 S3 객체를 라이브러리가 몰래 풀어, 내려받은 파일과
# 미리보기가 저장소의 내용과 달라진다. HTTP 항목의 응답은 http.rs가 직접 푼다.
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# 내장 SSH: 순수 Rust 구현. 암호는 이미 쓰고 있는 ring으로 한다(aws-lc는 빌드에 NASM·CMake가 필요하다).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["sync", "time", "net", "macros", "rt", "io-util"] }
# S3 호환 저장소 탐색기: 요청은 이미 쓰고 있는 ureq로 보내고, 저장하는 키의 암호화(AES-GCM·PBKDF2)는 ring으로 한다.
# rustls·webpki-roots는 ureq가 쓰는 것과 같은 판이다(사내 인증 기관을 믿는 TLS 설정을 직접 만들려고 꺼내 쓴다).
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
zeroize = "1"
cypher-core = { path = "../cypher-core" }
cypher-pty = { path = "../cypher-pty" }
